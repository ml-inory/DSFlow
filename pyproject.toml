[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsflow"
version = "0.1.0"
description = "DSFlow: Dual Supervision and Step-Aware Architecture for One-Step Flow Matching Speech Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy",
    "scipy",
    "soundfile",
    "g2p-en",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["dsflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
